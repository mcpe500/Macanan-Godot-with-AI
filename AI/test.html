<!DOCTYPE html>

  <title>Grid Visualization</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .grid-container {
      position: relative;
      width: 650px;
      height: 400px;
    }

    .node {
      position: absolute;
      width: 12px;
      height: 12px;
      background-color: lightgreen;
      border-radius: 50%;
    }

    .line {
      position: absolute;
      width: 2px;
      height: 2px;
      background-color: #ccc;
    }
  </style>
</head>
<body>
  <div class="grid-container">
    <!-- TITIK -->
